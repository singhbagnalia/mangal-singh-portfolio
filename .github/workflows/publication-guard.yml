name: Portfolio publication guard
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-guard:
    name: publication-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public portfolio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Inspect publication file list and content
        run: python3 .github/scripts/upload_guard.py
      - name: Download checksum-pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan reachable Git history without printing secrets
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git . --log-opts='--all --full-history' \
            --redact=100 --ignore-gitleaks-allow --no-banner --no-color
      - name: Scan proposed public files without printing secrets
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --ignore-gitleaks-allow --no-banner --no-color
